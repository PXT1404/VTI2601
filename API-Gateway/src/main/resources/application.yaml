spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: department-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/departments/**
        - id: position-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/positions/**

server:
  port: 8762
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

