spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: department-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/departments/**
        - id: position-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/positions/**
        - id: order-service
          uri: http://localhost:8180
          predicates:
            - Path=/api/v1/orders/**
        - id: product-service
          uri: http://localhost:8280
          predicates:
            - Path=/api/v1/products/**
        - id: auth-service
          uri: http://localhost:8189
          predicates:
            - Path=/api/v1/auths/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/vti2601
server:
  port: 8762
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true